/* One phone-width column, tab bar at the bottom. Single "Red Rocks at night" theme by design (like Altitud). */
:root{

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night)}

a{color:var(--ember)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:6px}

.bar .clock{color:#BDB6A8} .bar .clock b{color:#fff}

.bar-title{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:42px;height:28px;flex-shrink:0;border-radius:3px}

h2{font-size:40px;margin:34px 0 8px}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ember);text-transform:uppercase}
.muted{color:var(--sage)}
.small{font-size:14px}
.hero{padding:22px 0 4px;display:flex;flex-direction:column;gap:10px}
.route{font-size:14px;font-weight:700;color:var(--sand);letter-spacing:.02em}
.stitch{height:12px;background:var(--tatreez) repeat-x;background-size:24px 12px;margin:4px 0}
.card{background:var(--dusk);border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 1px 0 var(--rule)}

.pill.todo{background:var(--warn);color:#111} .pill.risk{background:var(--rock);color:#fff} .pill.info{background:var(--sky)}

.enc{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);padding:14px 0 4px}
.day-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.day-head .d{font-family:var(--display);font-weight:700;font-size:44px;line-height:.85;color:var(--ember);min-width:64px}

.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}

.ev .tm small{display:block;font-size:11px;color:var(--sage);font-weight:600;margin-top:2px}

.ev .nt{font-size:14px;color:var(--sage);margin-top:3px}

.ev.past{opacity:.55}
.ev .btns{margin-top:8px}
.ev .btn{min-height:34px;padding:5px 11px;font-size:13px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);font-weight:700}

.chk.done span{color:var(--sage);text-decoration:line-through}
.chk small{display:block;color:var(--sage);font-size:13px;text-decoration:none}
ul.tight{margin:6px 0 0;padding-left:20px} ul.tight li{margin:4px 0}

details > div{padding-bottom:16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);border-top:4px solid var(--rock);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:648px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;font-weight:700;color:var(--sage);min-height:58px}
.tab svg{width:22px;height:22px}
.tab{color:#A9A296} .tab[aria-selected=true]{color:#fff} .tab[aria-selected=true] svg{color:#E8293B}
.view[hidden]{display:none}
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.wx .card{margin:0;padding:14px}
.wx .t{font-family:var(--display);font-weight:700;font-size:34px;line-height:.9;color:var(--sand)}
.foot{margin-top:40px;font-size:12px;color:var(--sage);text-align:center}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k,d){try{const v=localStorage.getItem('rr:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem('rr:'+k,JSON.stringify(v))}catch(e){}}};
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function addDay(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
// Flatten events with absolute instants. An event time earlier than the previous one in the same day rolls nothing: days are listed in local order.
const EV = [];
DAYS.forEach((day,di) => day.ev.forEach((e,ei) => {
  const z = Z[e.z || day.z];
  const at = new Date(day.date + 'T' + e.t + ':00' + z);
  let end = null;
  if (e.end) end = new Date(day.date + 'T' + e.end + ':00' + z);
  if (e.arr) { let ad = day.date; let a = new Date(ad + 'T' + e.arr + ':00' + Z[e.az]); if (a < at) a = new Date(addDay(ad,1) + 'T' + e.arr + ':00' + Z[e.az]); end = a; }
  EV.push(Object.assign({}, e, {di, ei, at, end, z, date:day.date}));
}));
EV.sort((a,b) => a.at - b.at);
function fmtIn(d, z){ // wall-clock in a fixed offset
  const m = /([+-])(\d\d):(\d\d)/.exec(z); const off = (m[1]=='-'?-1:1)*(+m[2]*60 + +m[3]);
  const t = new Date(d.getTime() + off*60000);
  return {hh:String(t.getUTCHours()).padStart(2,'0'), mm:String(t.getUTCMinutes()).padStart(2,'0'), wd:WD[t.getUTCDay()], day:t.getUTCDate(), mo:MO[t.getUTCMonth()], iso:t.toISOString().slice(0,10)};
}
const NOW_Q = new URLSearchParams(location.search).get('now'); const NOW_OFF = NOW_Q ? new Date(NOW_Q) - Date.now() : 0;
const _Date = Date; function nowD(){ return new _Date(_Date.now() + NOW_OFF); }
const NY = '-04:00'; // EDT until 1 Nov
function hereZone(now){ let z = Z.SP; for (const e of EV) { if (e.at <= now) { z = (e.end && e.end <= now && e.az) ? Z[e.az] : e.z; } } return z; }
function dur(ms){ const m = Math.round(ms/60000); if (m < 60) return m + ' min'; const h = Math.floor(m/60), r = m%60; if (h < 48) return h + ' h' + (r ? ' ' + r : ''); return Math.round(h/24) + ' days'; }
function linksHtml(links){ return links && links.length ? '<div class="btns">' + links.map(([l,u]) => '<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(l)+'</a>').join('') + '</div>' : ''; }

function renderToday(){
  const now = nowD(), z = hereZone(now), here = fmtIn(now, z);
  let cur = null, next = null;
  for (const e of EV) { if (e.at <= now) cur = e; else { next = e; break; } }
  if (cur && cur.end && cur.end <= now && !(cur.k==='fly')) cur = cur; // keep last started as context
  const start = EV[0].at, last = EV[EV.length-1];
  let h = '<div class="hero"><span class="eyebrow">20–28 October 2026</span><h1>Red Rocks Run</h1><div class="stitch"></div>'
        + '<div class="route">São Paulo → Lima → Los Angeles → Denver → Panama → Rio → Juiz de Fora → São Paulo</div></div>';
  const flying = EV.find(e => e.k==='fly' && e.at <= now && e.end > now);
  const wheels = EV.find(e => e.k==='fly');
  if (now < wheels.at) {
    h += '<div class="card"><span class="eyebrow">Wheels up in</span><div class="big">' + dur(wheels.at-now) + '</div><p class="muted small">LA2425 · São Paulo 19:10</p></div>';
  }
  if (now < start) {
  } else if (flying) {
    h += '<div class="card hot"><span class="eyebrow">' + (/Cometa/.test(flying.n) ? 'On the bus' : 'In the air') + '</span><div class="big" style="font-size:38px;margin-top:6px">' + esc(flying.n.replace(/^(✈️|🚌)\s*/u,'')) + '</div><p class="muted">' + (/Cometa/.test(flying.n) ? 'Arrives in ' : 'Lands in ') + dur(flying.end-now) + ' · ' + fmtIn(flying.end, Z[flying.az]).hh + ':' + fmtIn(flying.end, Z[flying.az]).mm + ' local</p></div>';
  } else if (now - last.at > 6*3600e3) {
    $('#v-today').innerHTML = h + '<div class="card hot"><span class="eyebrow">Trip done</span><h3 style="margin-top:8px">Home in São Paulo. Welcome back.</h3></div>'; return;
  } else if (cur) {
    h += '<div class="card"><span class="eyebrow">Now · ' + here.hh + ':' + here.mm + ' ' + esc(ZN[z]||'') + '</span><h3 style="margin-top:8px">' + esc(cur.n) + '</h3>' + (cur.note ? '<p class="muted small">' + esc(cur.note) + '</p>' : '') + linksHtml(cur.links) + '</div>';
  }
  if (next) {
    const nt = fmtIn(next.at, next.z);
    h += '<div class="card hot"><span class="eyebrow">Next · in ' + dur(next.at-now) + '</span><div class="big" style="font-size:44px;margin-top:6px">' + nt.hh + ':' + nt.mm + '</div><h3 style="margin-top:8px">' + esc(next.n) + '</h3>' + (next.note ? '<p class="muted small">' + esc(next.note) + '</p>' : '') + linksHtml(next.links) + '</div>';
    const after = EV.slice(EV.indexOf(next)+1, EV.indexOf(next)+4);
    if (after.length) h += '<div class="card"><span class="eyebrow">After that</span>' + after.map(e => { const t = fmtIn(e.at, e.z); return '<div class="ev" style="border-bottom:0;padding:8px 0"><div class="tm">' + t.wd + ' ' + t.hh + ':' + t.mm + '</div><div class="nm">' + esc(e.n) + '</div></div>'; }).join('') + '</div>';
  } else if (now > last.at) {
    h += '<div class="card"><span class="eyebrow">Done</span><h3 style="margin-top:8px">Home in São Paulo. Welcome back.</h3></div>';
  }
  const ny = fmtIn(now, NY), sp = fmtIn(now, Z.SP);
  h += '<div class="card"><span class="eyebrow">Clocks</span><dl class="kv" style="margin-top:8px"><dt>Here</dt><dd><b>' + here.hh + ':' + here.mm + '</b> ' + esc(ZN[z]||'') + '</dd><dt>New York</dt><dd>' + ny.hh + ':' + ny.mm + ' (work clock)</dd><dt>Brazil</dt><dd>' + sp.hh + ':' + sp.mm + '</dd></dl></div>';
  const open = CHECK.filter(c => !checks[c[0]]).slice(0,3);
  if (open.length) h += '<div class="card"><span class="eyebrow">Still to do</span><ul class="tight">' + open.map(c => '<li>' + esc(c[1]) + '</li>').join('') + '</ul><div class="btns"><button class="btn" data-go="prac">Full checklist</button></div></div>';
  h += '<div id="todayWx"></div>';
  $('#v-today').innerHTML = h;
  todayWeather(here.iso);
}

  h += '<h2 style="margin-top:22px">Day by day</h2><p class="muted small">Times are local where you are. Tap Directions to open Maps.</p>';

    if (day.warn) h += '<div class="card hot small" style="margin-top:10px">💡 ' + esc(day.warn) + '</div>';
    day.ev.forEach(e => {
      const x = EV.find(v => v.date===day.date && v.t===e.t && v.n===e.n);
      const isNow = x.at <= now && ((x.end && x.end > now) || (!x.end && (EV[EV.indexOf(x)+1]||{at:new Date(8.64e15)}).at > now));
      const past = !isNow && (x.end || x.at) < now;
      const zl = e.z && e.z !== day.z ? '<small>' + (ZN[Z[e.z]]||'') + '</small>' : '';
      const end = e.end ? '<small>to ' + e.end + '</small>' : (e.arr ? '<small>→ ' + e.arr + '</small>' : '');

  $('#v-days').innerHTML = h;

}

    g.items.forEach(b => {

        + (b.todo.length ? '<div class="small" style="margin-top:8px"><b style="color:#8A5A00">To do</b><ul class="tight">' + b.todo.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '') + linksHtml(b.links) + '</div>';
    });
  });
  $('#v-book').innerHTML = h;
  spy();
}

function renderWork(){
  let h = '<h2 style="margin-top:22px">Work hours</h2><p class="muted small">Your day is 09:00–17:00 New York throughout. The US stays on daylight time until 1 Nov; Brazil has none.</p>';
  h += '<div class="card"><dl class="kv"><dt>São Paulo / Rio / JF</dt><dd>10:00–18:00 (NY + 1 h)</dd><dt>Lima</dt><dd>08:00–16:00 (NY − 1 h)</dd><dt>Los Angeles</dt><dd>06:00–14:00 (NY − 3 h)</dd><dt>Denver</dt><dd>07:00–15:00 (NY − 2 h)</dd><dt>Panama</dt><dd>08:00–16:00 (NY − 1 h)</dd></dl></div>';
  h += '<div class="scroll" style="margin-top:14px"><table><thead><tr><th>Day</th><th>Where</th><th>Local hours</th><th>Notes</th></tr></thead><tbody>'
    + WORK.map(r => '<tr><td class="n"><b>' + r[0] + '</b></td><td>' + esc(r[1]) + '</td><td class="n">' + esc(r[2]) + (r[4]==='part' ? ' <span class="pill risk">partial</span>' : r[4]==='off' ? ' <span class="pill info">off</span>' : '') + '</td><td class="muted">' + esc(r[3]) + '</td></tr>').join('')
    + '</tbody></table></div>';
  h += '<div class="card hot small" style="margin-top:14px"><b>Wednesday 21 is the gap.</b> 09:00–12:30 NY you are over the Pacific (06:00–09:30 LA). You\'re back online 09:30 LA = 12:30 NY, and the museum takes 13:00–15:00 LA (16:00–18:00 NY, after hours).</div>';
  $('#v-work').innerHTML = h;
}

function renderShow(){
  let h = '<div class="hero"><span class="eyebrow">Thu 22 Oct · doors 18:00 · show 19:00</span><h1 style="font-size:clamp(38px,11.5vw,72px)">Macklemore</h1><div class="stitch"></div><div class="route">Red Rocks Amphitheatre · Row 4, seats 86–87</div></div>';
  h += '<p class="muted small">Expected set: the Ben Tour average setlist (setlist.fm, 55 shows), plus HIND\'S HALL, which he has played at every recent show. The real order changes night to night.</p>';
  h += '<div class="btns"><a class="sp" href="' + sp('Macklemore Ben Tour setlist') + '" target="_blank" rel="noopener">▶ Setlist playlists on Spotify</a><a class="btn" href="https://www.setlist.fm/setlists/macklemore-1bd76d34.html" target="_blank" rel="noopener">Latest on setlist.fm</a></div>';
  let n = 0; h += '<div class="card" style="padding:4px 16px 8px">';
  SETLIST.forEach(x => { if (x.length === 1) { h += '<div class="enc">Encore</div>'; return; } n++;
    h += '<div class="song"><div class="no">' + n + '</div><div><div class="tt">' + esc(x[0]) + (x[3]==='pal' ? ' 🇵🇸' : '') + '</div><div class="ft">' + esc(x[1]) + '</div></div><a class="sp" href="' + sp(x[2]) + '" target="_blank" rel="noopener" aria-label="Play ' + esc(x[0]) + ' on Spotify">▶ Spotify</a></div>'; });
  h += '</div><p class="muted small" style="margin-top:10px">Each button opens the song in Spotify search (app or web).</p>';
  $('#v-show').innerHTML = h;
}

let checks = store.get('checks', {});
function chkList(list){ return list.map(([id,t,s]) => '<label class="chk' + (checks[id]?' done':'') + '"><input type="checkbox" data-c="' + id + '"' + (checks[id]?' checked':'') + '><span>' + esc(t) + (s ? '<small>' + esc(s) + '</small>' : '') + '</span></label>').join(''); }
function renderPrac(){
  let h = '<h2 style="margin-top:22px">Practical</h2>';
  h += '<h3 style="margin-top:18px;color:var(--sand)">Checklist</h3>' + chkList(CHECK);
  h += '<h3 class="jsec" id="pk" style="margin-top:26px;color:var(--sand)">Carry-on packing</h3><p class="muted small">Everything has to fit a cabin bag + under-seat bag (≈ 10 kg). Ticks are saved on this phone.</p>' + PACK.map(g => '<div style="font-weight:700;margin-top:14px">' + esc(g.g) + ' <span class="muted small">' + g.items.filter(x => checks[x[0]]).length + '/' + g.items.length + '</span></div>' + chkList(g.items)).join('');
  h += '<h3 style="margin-top:26px;color:var(--sand)">Weather</h3><p class="muted small">Live forecast for the day you\'re in each place (Open-Meteo, updates when online).</p><div class="wx" id="wx"></div><div id="rrHours"></div>';
  h += '<details><summary>🎸 Red Rocks: what decides the night</summary><div class="small"><ul class="tight">'
    + '<li>Both tickets are in Kat\'s AXS app and non-transferable: walk in together, passport in hand.</li>'
    + '<li>≈ 1,950 m, open to the sky. It cools fast after dark and you sit still 18:00–23:00: check the hourly forecast above and bring a real warm layer.</li>'
    + '<li>The lots fill early and the walk up to the seats is steep: leaving at 16:45 is right.</li>'
    + '<li>Altitude + dry air: drink water, go easy on alcohol.</li>'
    + '<li>Check the bag policy on the Red Rocks event page (small clear bags are the norm).</li></ul></div></details>';
  h += '<details><summary>🇵🇦 Panama: before you leave the airport</summary><div class="small"><p>Leaving Tocumen for the tour is a real entry into Panama. Not yet checked against an official source, so confirm with Panama\'s migration service (Migración Panamá) before you pay an operator:</p><ul class="tight">'
    + '<li>Does a Brazilian passport need anything for a same-day tourist entry?</li>'
    + '<li>Is a yellow-fever certificate asked for on arrival from Brazil? (You arrive from Denver, which may help, but carry the ICV.)</li>'
    + '<li>Proof of onward travel: yours is the same evening.</li></ul><p>If any answer is a problem: stay airside 13 h, nothing lost. Late October is wet season (≈ 29°/24°, rain likely).</p><div class="btns"><a class="btn" href="https://www.migracion.gob.pa/" target="_blank" rel="noopener">Migración Panamá</a></div></div></details>';
  h += '<details><summary>🇺🇸 US entry + money</summary><div class="small"><ul class="tight">'
    + '<li>Brazilians need a valid US visa (B1/B2) in the passport: must cover 21–23 Oct.</li>'
    + '<li>Budget rate ≈ R$5.31 per US$ (spot + card IOF).</li>'
    + '<li>Tipping: 18–20 % at sit-down places; Uber tip in the app.</li>'
    + '<li>Plugs: type A/B, 120 V.</li></ul></div></details>';
  h += '<details><summary>🗳️ Voting on Sunday 25</summary><div class="small"><ul class="tight"><li>2nd round, polls 08:00–17:00 Brasília time.</li><li>Bring an official photo ID or use the e-Título app.</li><li>You land 04:05 and your parents drive you home for ≈ 08:00–09:30: comfortable.</li></ul></div></details>';
  h += '<details><summary>🆘 Emergencies</summary><div class="small"><dl class="kv"><dt>USA</dt><dd>911</dd><dt>Panama</dt><dd>911</dd><dt>Brazil</dt><dd>190 police · 192 ambulance</dd><dt>Insurance</dt><dd>Assist Card · <a href="tel:+551131918699">+55 11 3191 8699</a> · US <a href="tel:+18008742223">1 800 874 2223</a> · no. 550 34057611 0L30 LA155 / 1 (call before going to an ER)</dd><dt>Hyatt Place DEN</dt><dd><a href="tel:+13033710700">+1 303-371-0700</a></dd></dl></div></details>';
  $('#v-prac').innerHTML = h;
  renderWx();
}
document.addEventListener('change', e => { const id = e.target.dataset && e.target.dataset.c; if (!id) return; checks[id] = e.target.checked; store.set('checks', checks); e.target.closest('.chk').classList.toggle('done', e.target.checked); if (cur === 'prac') { const y = scrollY; renderPrac(); scrollTo(0, y); } });

/* ---------- weather (Open-Meteo, no key) ---------- */
const WMO = c => c==null?'':c<=1?'☀️':c<=3?'⛅':c<=48?'🌫️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌦️':'⛈️';
let wx = store.get('wx', null);
async function loadWx(force){
  if (!force && wx && Date.now() - wx.t < 3*3600e3) return wx;
  try {
    const lat = PLACES.map(p=>p.lat).join(','), lon = PLACES.map(p=>p.lon).join(',');
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=16');
    const j = await r.json(); const arr = Array.isArray(j) ? j : [j];
    const out = {t:Date.now(), p:{}};
    PLACES.forEach((p,i) => { const d = arr[i].daily, k = d.time.indexOf(p.d); if (k>=0) out.p[p.k] = {hi:Math.round(d.temperature_2m_max[k]), lo:Math.round(d.temperature_2m_min[k]), rain:d.precipitation_probability_max[k], code:d.weather_code[k]};
      if (p.k==='rr') { const H = arr[i].hourly; out.rr = []; H.time.forEach((t,x) => { if (t.startsWith(p.d) && +t.slice(11,13) >= 18 && +t.slice(11,13) <= 23) out.rr.push([t.slice(11,16), Math.round(H.temperature_2m[x]), H.weather_code[x]]); }); } });
    wx = out; store.set('wx', wx);
  } catch (e) {}
  return wx;
}
function wxCard(p){ const w = wx && wx.p[p.k]; const d = new Date(p.d+'T12:00:00Z');
  return '<div class="card"><div class="small muted">' + WD[d.getUTCDay()] + ' ' + d.getUTCDate() + ' Oct</div><div style="font-weight:700">' + esc(p.n) + '</div>' + (w ? '<div class="t">' + WMO(w.code) + ' ' + w.hi + '°</div><div class="small muted">low ' + w.lo + '° · rain ' + (w.rain==null?'–':w.rain+'%') + '</div>' : '<div class="small muted">Forecast not in range yet</div>') + '</div>'; }
async function renderWx(){ await loadWx(); const el = $('#wx'); if (!el) return; el.innerHTML = PLACES.filter(p=>p.k!=='jf2').map(wxCard).join('');
  const rr = $('#rrHours'); if (rr && wx && wx.rr && wx.rr.length) rr.innerHTML = '<div class="card hot small"><b>Red Rocks, Thu evening</b><div class="btns" style="margin-top:8px">' + wx.rr.map(([t,c,w]) => '<span class="btn" style="cursor:default">' + t + ' ' + WMO(w) + ' ' + c + '°</span>').join('') + '</div></div>'; }
async function todayWeather(iso){ await loadWx(); const el = $('#todayWx'); if (!el || !wx) return; const ps = PLACES.filter(p => p.d === iso); if (!ps.length) return;
  el.innerHTML = '<div class="wx">' + ps.map(wxCard).join('') + '</div>'; }

/* ---------- shell ---------- */
const VIEWS = {today:renderToday, days:renderDays, book:renderBook, show:renderShow, work:renderWork, prac:renderPrac};
const TITLES = {today:'Red Rocks Run', days:'Day by day', book:'Bookings', show:'The show', work:'Work hours', prac:'Practical'};
let cur = null;
function go(v, push){
  if (!VIEWS[v]) v = 'today';
  document.querySelectorAll('.view').forEach(s => s.hidden = s.id !== 'v-' + v);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === v));
  $('#barTitle').textContent = TITLES[v];
  VIEWS[v](); cur = v;
  if (push !== false && location.hash !== '#' + v) history.pushState(null, '', '#' + v);
  window.scrollTo(0,0);
  if (v === 'days') { const now = nowD(), iso = fmtIn(now, hereZone(now)).iso, el = document.getElementById('day-' + iso); setTimeout(() => { setBarH(); if (el) jump('day-' + iso); else spy(); }, 30); }
}
function setBarH(){ document.documentElement.style.setProperty('--barH', $('.bar').offsetHeight + 'px'); }
function markJump(id){ const v = document.querySelector('.view:not([hidden])'); if (!v) return; v.querySelectorAll('[data-jump]').forEach(c => { const on = c.dataset.jump === id; c.classList.toggle('on', on); if (on) c.scrollIntoView({inline:'center', block:'nearest'}); }); }
function jump(id){ const el = document.getElementById(id); if (el) { el.scrollIntoView({block:'start'}); markJump(id); } }
let spyT;
function spy(){ const v = document.querySelector('.view:not([hidden])'); if (!v) return; const secs = v.querySelectorAll('.jsec'); if (!secs.length) return;
  const lim = $('.bar').offsetHeight + 90; let id = secs[0].id; secs.forEach(d => { if (d.getBoundingClientRect().top <= lim) id = d.id; }); markJump(id); }
window.addEventListener('scroll', () => { clearTimeout(spyT); spyT = setTimeout(spy, 80); }, {passive:true});
window.addEventListener('resize', setBarH); setBarH();
document.addEventListener('click', e => { const dc = e.target.closest('[data-jump]'); if (dc) { jump(dc.dataset.jump); return; } });
document.addEventListener('click', e => { const t = e.target.closest('[data-v],[data-go]'); if (t) go(t.dataset.v || t.dataset.go); });
window.addEventListener('popstate', () => go(location.hash.slice(1), false));
function tick(){ const now = nowD(), z = hereZone(now), h = fmtIn(now, z), ny = fmtIn(now, NY);
  $('#clock').innerHTML = '<b>' + h.hh + ':' + h.mm + '</b> here<br>' + ny.hh + ':' + ny.mm + ' NY'; }
tick(); setInterval(() => { tick(); if (cur === 'today') renderToday(); }, 60000);
go(location.hash.slice(1) || 'today', false);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
